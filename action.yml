name: "Zero-Downtime Migration Guard"
description: "Block dangerous table locks and rollback safety failures in database migrations"
branding:
  icon: "database"
  color: "blue"
inputs:
  path:
    description: "Path to migrations directory"
    required: false
    default: "migrations"
  fail_on_warning:
    description: "Fail on HIGH severity deprecation warnings"
    required: false
    default: "false"
  license_key:
    description: "OrderStream Pro/Enterprise license key (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install zero-downtime-migration-guard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}
    - name: Run Migration Safety Audit
      shell: bash
      env:
        ORDERSTREAM_LICENSE_KEY: ${{ inputs.license_key }}
      run: |
        WARN_FLAG=""
        if [ "${{ inputs.fail_on_warning }}" = "true" ]; then
          WARN_FLAG="--fail-on-warning"
        fi
        zero-downtime-migration-guard check \
          --path "${{ inputs.path }}" \
          $WARN_FLAG
